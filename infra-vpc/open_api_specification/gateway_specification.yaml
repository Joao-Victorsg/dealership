openapi: 3.0.1
info:
  title: Dealership API
  description: API to manage a Dealership system.
  version: 1.0.0
servers:
  - url: /v1/dealership
    description: Base URL for the Dealership API
paths:
  /clients:
    get:
      summary: Get All Clients
      description: Retrieve a paginated list of all clients, optionally filtered by city and state.
      parameters:
        - name: city
          in: query
          description: Filter clients by city.
          required: false
          schema:
            type: string
        - name: state
          in: query
          description: Filter clients by state.
          required: false
          schema:
            type: string
        - name: page
          in: query
          description: Pagination page number.
          required: false
          schema:
            type: integer
        - name: size
          in: query
          description: Number of results per page.
          required: false
          schema:
            type: integer
        - name: sort
          in: query
          description: Sorting criteria (e.g., `name,asc`).
          required: false
          schema:
            type: string
      responses:
        '200':
          description: A paginated list of clients.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedClientResponse'
    post:
      summary: Create Client
      description: Create a new client in the system.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientRequest'
      responses:
        '201':
          description: Client created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientResponse'
        '409':
          description: A client with the given CPF already exists.
  /clients/{cpf}:
    get:
      summary: Get Client by CPF
      description: Retrieve a single client by their CPF.
      parameters:
        - name: cpf
          in: path
          required: true
          description: CPF of the client to retrieve.
          schema:
            type: string
      responses:
        '200':
          description: Client details retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientResponse'
        '404':
          description: Client not found.
    put:
      summary: Update Client
      description: Update the name or address of a client by their CPF.
      parameters:
        - name: cpf
          in: path
          required: true
          description: CPF of the client to update.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientUpdateRequest'
      responses:
        '200':
          description: Client updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientResponse'
        '404':
          description: Client not found.
    delete:
      summary: Delete Client
      description: Delete a client by their CPF.
      parameters:
        - name: cpf
          in: path
          required: true
          description: CPF of the client to delete.
          schema:
            type: string
      responses:
        '200':
          description: Client deleted successfully.
        '404':
          description: Client not found.
  /cars:
    post:
      summary: Save a car in the database
      operationId: createCar
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CarDtoRequest'
      responses:
        "201":
          description: The car was created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseCarDtoResponse'
        "400": { $ref: '#/components/responses/BadRequest' }
        "408": { $ref: '#/components/responses/RequestTimeout' }
        "409": { $ref: '#/components/responses/Conflict' }
        "500": { $ref: '#/components/responses/InternalServerError' }
        "502": { $ref: '#/components/responses/BadGateway' }
        "503": { $ref: '#/components/responses/ServiceUnavailable' }
        "504": { $ref: '#/components/responses/GatewayTimeout' }
    get:
      summary: Return a page of cars
      operationId: searchAllCars
      parameters:
        - name: initialValue
          in: query
          schema:
            type: number
        - name: finalValue
          in: query
          schema:
            type: number
        - name: modelYear
          in: query
          schema:
            type: string
        - name: model
          in: query
          schema:
            type: string
        - name: manufacturer
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Return a list of cars
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponsePageCarDtoResponse'
        "400": { $ref: '#/components/responses/BadRequest' }
        "408": { $ref: '#/components/responses/RequestTimeout' }
        "500": { $ref: '#/components/responses/InternalServerError' }
        "503": { $ref: '#/components/responses/ServiceUnavailable' }
        "504": { $ref: '#/components/responses/GatewayTimeout' }
  /cars/{vin}:
    get:
      summary: Return one car
      operationId: searchCarByVin
      parameters:
        - name: vin
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The car was returned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseCarDtoResponse'
        "400": { $ref: '#/components/responses/BadRequest' }
        "404": { $ref: '#/components/responses/NotFound' }
        "408": { $ref: '#/components/responses/RequestTimeout' }
        "500": { $ref: '#/components/responses/InternalServerError' }
        "503": { $ref: '#/components/responses/ServiceUnavailable' }
        "504": { $ref: '#/components/responses/GatewayTimeout' }
    put:
      summary: Update a car's color or value
      operationId: updateCar
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CarDtoUpdateRequest'
      responses:
        "200":
          description: The car was updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseCarDtoResponse'
        "404": { $ref: '#/components/responses/NotFound' }
        "408": { $ref: '#/components/responses/RequestTimeout' }
        "502": { $ref: '#/components/responses/BadGateway' }
        "503": { $ref: '#/components/responses/ServiceUnavailable' }
        "504": { $ref: '#/components/responses/GatewayTimeout' }
    delete:
      summary: Delete a car by VIN
      operationId: deleteCar
      responses:
        "200":
          description: The car was deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseString'
        "404": { $ref: '#/components/responses/NotFound' }
        "408": { $ref: '#/components/responses/RequestTimeout' }
        "500": { $ref: '#/components/responses/InternalServerError' }
        "502": { $ref: '#/components/responses/BadGateway' }
        "503": { $ref: '#/components/responses/ServiceUnavailable' }
        "504": { $ref: '#/components/responses/GatewayTimeout' }
  /sales:
    post:
      summary: Create a sale
      operationId: createSale
      tags:
        - Sales
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SalesDtoRequest'
      responses:
        '201':
          description: The sale was created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseSalesDtoResponse'
        '400':
          description: The server cannot process the request due to a client error
        '408':
          description: The request timed out
        '409':
          description: There was a conflict when creating the sale
        '500':
          description: There was an internal server error
        '502':
          description: Bad Gateway, the server got an invalid response
        '503':
          description: The service is unavailable
        '504':
          description: The Gateway timed out
    get:
      summary: Return a page of sales
      operationId: searchAllSales
      tags:
        - Sales
      parameters:
        - name: initialDate
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: finalDate
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: cpf
          in: query
          required: false
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            default: 20
        - name: sort
          in: query
          required: false
          schema:
            type: string
            example: id,asc
      responses:
        '200':
          description: Return a list of sales
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponsePageSalesDtoResponse'
        '400':
          description: The server cannot process the request due to a client error
        '408':
          description: The request timed out
        '500':
          description: There was an internal server error
        '503':
          description: The service is unavailable
        '504':
          description: The Gateway timed out
  /sales/{id}:
    get:
      summary: Return one sale
      operationId: searchSale
      tags:
        - Sales
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The sale was returned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseSalesDtoResponse'
        '400':
          description: The server cannot process the request due to a client error
        '404':
          description: There wasn't a sale with the ID that was informed
        '408':
          description: The request timed out
        '500':
          description: There was an internal server error
        '503':
          description: The service is unavailable
        '504':
          description: The Gateway timed out
    delete:
      summary: Delete a sale passing the ID
      operationId: cancelSale
      tags:
        - Sales
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The sale was deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseString'
        '404':
          description: There wasn't a sale with the ID that was informed
        '408':
          description: The request timed out
        '500':
          description: There was an internal server error
        '502':
          description: Bad Gateway, the server got an invalid response
        '503':
          description: The service is unavailable
        '504':
          description: The Gateway timed out
components:
  schemas:
    ClientRequest:
      type: object
      properties:
        name:
          type: string
          description: Full name of the client.
        cpf:
          type: string
          description: CPF (unique identifier) of the client.
        address:
          $ref: '#/components/schemas/Address'
      required:
        - name
        - cpf
    ClientUpdateRequest:
      type: object
      properties:
        postCode:
          type: string
          description: Postal code of the client's address.
        streetNumber:
          type: string
          description: Street number of the client's address.
    ClientResponse:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier of the client.
        name:
          type: string
          description: Full name of the client.
        cpf:
          type: string
          description: CPF (unique identifier) of the client.
        address:
          $ref: '#/components/schemas/Address'
    PaginatedClientResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/ClientResponse'
        pageable:
          type: object
          description: Pageable metadata.
        totalElements:
          type: integer
          description: Total number of clients.
    Address:
      type: object
      properties:
        postCode:
          type: string
          description: Postal code of the address.
        streetNumber:
          type: string
          description: Street number of the address.
    CarDtoRequest:
      type: object
      properties:
        vin:
          type: string
        model:
          type: string
        manufacturer:
          type: string
        value:
          type: number
    CarDtoUpdateRequest:
      type: object
      properties:
        color:
          type: string
        value:
          type: number
    CarDtoResponse:
      type: object
      properties:
        vin:
          type: string
        model:
          type: string
        manufacturer:
          type: string
        value:
          type: number
    ResponseCarDtoResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/CarDtoResponse'
    ResponsePageCarDtoResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CarDtoResponse'
    ResponseString:
      type: object
      properties:
        data:
          type: string
    ResponseSalesDtoResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/SalesDtoResponse'
    ResponsePageSalesDtoResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            content:
              type: array
              items:
                $ref: '#/components/schemas/SalesDtoResponse'
            totalElements:
              type: integer
            totalPages:
              type: integer
            size:
              type: integer
            number:
              type: integer
            sort:
              type: object
            first:
              type: boolean
            last:
              type: boolean
            numberOfElements:
              type: integer
            empty:
              type: boolean
  responses:
    BadRequest:
      description: The server cannot process the request due to a client error
    RequestTimeout:
      description: The request timed out
    Conflict:
      description: There was a conflict when creating the car
    NotFound:
      description: The resource was not found
    InternalServerError:
      description: There was an internal server error
    BadGateway:
      description: Bad Gateway, the server got an invalid response
    ServiceUnavailable:
      description: The service is unavailable
    GatewayTimeout:
      description: The Gateway timed out