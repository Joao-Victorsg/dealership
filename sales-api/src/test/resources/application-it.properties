spring.application.name=sales-api

server.port=8080

server.servlet.context-path=/v1/dealership

#Actuator
management.endpoints.web.exposure.include=health,info

#Database
spring.jpa.properties.hibernate.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.username=dealership
spring.datasource.password=12345678
spring.jpa.hibernate.ddl-auto=none

# swagger-ui custom path
springdoc.swagger-ui.path=/swagger-ui.html

# sns
spring.cloud.aws.sns.region=us-east-1
sales.sns.topic.arn=${SALES_SNS_TOPIC_ARN:arn:aws:sns:us-east-1:000000000000:sales-topic}