spring.application.name=sales-api

server.port=8087
server.http2.enabled=true
server.compression.enabled=true
server.compression.mime-types=application/json
server.min-response-size=1024

server.servlet.context-path=/v1/dealership

#Actuator
management.endpoints.web.exposure.include=health,info

#Database
spring.datasource.url=jdbc:postgresql://localhost.localstack.cloud:4512/dealershipdb
spring.jpa.properties.hibernate.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.username=dealership
spring.datasource.password=12345678
spring.jpa.hibernate.ddl-auto=create

# swagger-ui custom path
springdoc.swagger-ui.path=/swagger-ui.html

# sns
spring.cloud.aws.sns.endpoint=http://localstack:4566
spring.cloud.aws.sns.region=us-east-1
sales.sns.topic.arn=${SALES_SNS_TOPIC_ARN:teste}