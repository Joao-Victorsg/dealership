server.servlet.context-path=/v1/dealership
server.port=8080

spring.jpa.properties.hibernate.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.username=dealership
spring.datasource.password=12345678

spring.jpa.hibernate.ddl-auto=create-drop

##SQS
cloud.aws.sqs.region=us-east-1
aws.sqs.queue.name=client-car-creation-event-queue

#Feign Client Changes
feign.client.config.default.connectTimeout=5000
feign.client.config.default.readTimeout=5000

#Circuit breaker
#resilience4j.circuitbreaker.instances.searchAddressGatewaybyPostCode.baseConfig=default
resilience4j.circuitbreaker.instances.searchAddressGatewaybyPostCode.registerHealthIndicator=true
#resilience4j.circuitbreaker.instances.searchAddressGatewaybyPostCode.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.searchAddressGatewaybyPostCode.slidingWindowSize=3
resilience4j.circuitbreaker.instances.searchAddressGatewaybyPostCode.minimumNumberOfCalls=2
resilience4j.circuitbreaker.instances.searchAddressGatewaybyPostCode.waitDurationInOpenState=2s
resilience4j.circuitbreaker.instances.searchAddressGatewaybyPostCode.failureRateThreshold=10
resilience4j.circuitbreaker.instances.searchAddressGatewaybyPostCode.permittedNumberOfCallsInHalfOpenState=2
resilience4j.circuitbreaker.instances.searchAddressGatewaybyPostCode.slowCallRateThreshold=10
resilience4j.circuitbreaker.instances.searchAddressGatewaybyPostCode.slowCallDurationThreshold=1s
resilience4j.circuitbreaker.instances.searchAddressGatewaybyPostCode.ignoreExceptions=feign.FeignException.BadRequest,feign.FeignException.InternalServerError, feign.FeignException.NotFound, feign.FeignException.Unauthorized
resilience4j.circuitbreaker.instances.searchAddressGatewaybyPostCode.recordExceptions=feign.FeignException.GatewayTimeout, feign.FeignException.TooManyRequests, feign.FeignException.ServiceUnavailable