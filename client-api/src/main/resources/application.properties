spring.application.name=api-client

server.servlet.context-path=/v1/dealership

server.port=8085

#Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

#Database
spring.datasource.url=jdbc:postgresql://localhost.localstack.cloud:4510/dealershipdb
spring.jpa.properties.hibernate.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.username=dealership
spring.datasource.password=12345678
spring.jpa.hibernate.ddl-auto=create-drop

#via cep url
via-cep.url=https://viacep.com.br/ws/

# swagger-ui custom path
springdoc.swagger-ui.path=/swagger-ui.html

## SQS
cloud.aws.sqs.endpoint=http://localhost.localstack.cloud:4566
cloud.aws.sqs.region=us-east-1
aws.sqs.queue.name=client-car-creation-event-queue

#Feign Client Changes
feign.client.config.default.connectTimeout=5000
feign.client.config.default.readTimeout=5000

#Circuit breaker
resilience4j.circuitbreaker.instances.searchAddressGatewaybyPostCode.baseConfig=default
resilience4j.circuitbreaker.configs.default.registerHealthIndicator=true
resilience4j.circuitbreaker.configs.default.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.configs.default.slidingWindowSize=2
resilience4j.circuitbreaker.configs.default.minimumNumberOfCalls=2
resilience4j.circuitbreaker.configs.default.waitDurationInOpenState=50s
resilience4j.circuitbreaker.configs.default.failureRateThreshold=10
resilience4j.circuitbreaker.configs.default.permittedNumberOfCallsInHalfOpenState=2
resilience4j.circuitbreaker.configs.default.slowCallRateThreshold=60
resilience4j.circuitbreaker.configs.default.slowCallDurationThreshold=4s
resilience4j.circuitbreaker.configs.default.ignoreExceptions=feign.FeignException.BadRequest,feign.FeignException.InternalServerError, feign.FeignException.NotFound, feign.FeignException.Unauthorized
resilience4j.circuitbreaker.configs.default.recordExceptions=feign.FeignException.GatewayTimeout, feign.FeignException.TooManyRequests, feign.FeignException.ServiceUnavailable